name: bhoomi_setu_fo
description: "Bhoomi Setu Field Officer — offline-first field verification client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.6.1

  # Local DB (SQLite)
  drift: ^2.28.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.36
  path_provider: ^2.1.5
  path: ^1.9.1

  # Network
  http: ^1.4.0
  http_parser: ^4.0.2
  connectivity_plus: ^6.1.4

  # Device
  geolocator: ^14.0.0
  camera: ^0.11.1
  file_picker: ^10.2.0
  permission_handler: ^12.0.1

  # Map
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Storage / session
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.6.0

flutter:
  uses-material-design: true
